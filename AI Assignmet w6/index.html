<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styl.css">
</head>

<body>

    <div class="game">
        <h1>Rock, Paper, Scissors</h1>
        <p id="turn">Press Start to play!</p>

        <button id="start-btn" class="control-btn" onclick="startGame()">▶️ Start Game</button>

        <div class="choices hidden" id="choices">
            <button onclick="playGame('rock')">🪨 Rock</button>
            <button onclick="playGame('paper')">📄 Paper</button>
            <button onclick="playGame('scissors')">✂️ Scissors</button>
        </div>

        <div class="result">
            <h2 id="result"></h2>
            <p id="score">Player: 0 | Computer: 0</p>
        </div>

        <button id="restart-btn" class="control-btn hidden" onclick="restartGame()">🔄 Restart</button>
    </div>

    <script src="java.js"></script>
</body>

</html>
